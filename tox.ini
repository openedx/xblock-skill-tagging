[tox]
envlist = py312-django{42,52}, quality, docs
requires = tox-uv>=1

[pycodestyle]
exclude = .git,.tox,migrations
max-line-length = 120

[isort]
line_length = 120
known_edx =
known_django = django
known_djangoapp = model_utils
known_first_party = taxonomy
include_trailing_comma = true
multi_line_output = 3
sections = FUTURE,STDLIB,THIRDPARTY,DJANGO,DJANGOAPP,EDX,FIRSTPARTY,LOCALFOLDER

[pytest]
DJANGO_SETTINGS_MODULE = test_settings
addopts = --cov skill_tagging --cov-report term-missing --cov-report xml
norecursedirs = .* docs requirements site-packages

[testenv]
runner = uv-venv-lock-runner
dependency_groups =
    django42: django42
    django52: test
allowlist_externals =
    make
commands =
    make test


[testenv:docs]
runner = uv-venv-lock-runner
dependency_groups = doc
allowlist_externals =
    make
commands =
    doc8 --ignore-path docs/_build README.rst docs
    python -m build --wheel
    twine check dist/*
    make -C docs clean
    make -C docs html

[testenv:quality]
runner = uv-venv-lock-runner
dependency_groups = quality
allowlist_externals =
    make
    rm
    touch
    pylint
    pycodestyle
    isort
commands =
    touch tests/__init__.py
    pylint src/skill_tagging tests
    rm tests/__init__.py
    pycodestyle src/skill_tagging tests
    isort --check-only --diff tests src/skill_tagging test_settings.py
    make selfcheck
