[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skill_tagging"
description = "Django app plugin for fetching and verifying tags for xblock skills."
readme = "README.rst"
license = "AGPL-3.0"
license-files = ["LICENSE.txt"]
authors = [
    {name = "edX", email = "oscm@edx.org"},
]
keywords = ["Python", "edx"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "Django>=4.2",
    "django-model-utils",
    "openedx-events",
    "openedx-filters",
    "openedx-django-pyfs",
    "lazy",
]

[project.urls]
Homepage = "https://github.com/openedx/xblock-skill-tagging"

[project.entry-points."lms.djangoapp"]
skill_tagging = "skill_tagging.apps:SkillTaggingConfig"

[tool.setuptools_scm]
version_scheme = "only-version"
local_scheme = "no-local-version"

[tool.setuptools.packages.find]
where = ["src"]
include = ["skill_tagging*"]

[tool.setuptools.exclude-package-data]
"*" = ["tests*", "*.tests*", "spec*", "*.spec*"]

[tool.coverage.run]
branch = true
source = ["skill_tagging"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__pycache__/*",
    "*/settings.py",
    "*/test_settings.py",
    "*admin.py",
    "*/static/*",
    "*/templates/*",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "htmlcov"

[dependency-groups]
# Base test dependencies (no Django — pinned per group below)
test-base = [
    "pytest-cov",
    "pytest-django",
    "code-annotations",
    "xblock-sdk",
    "djangorestframework",
    "mock",
]
# Default test group uses current supported Django (5.2)
test = [
    {include-group = "test-base"},
    "Django>=5.2,<6.0",
]
# Legacy Django 4.2 support
django42 = [
    {include-group = "test-base"},
    "Django>=4.2,<5.0",
]
quality = [
    {include-group = "test"},
    "edx-lint",
    "isort",
    "pycodestyle",
    "pydocstyle",
]
doc = [
    {include-group = "test"},
    "doc8",
    "twine",
    "build",
    "Sphinx",
]
# Minimal CI group — install first, then call uv run tox
ci = [
    "tox",
    "tox-uv",
]
dev = [
    {include-group = "quality"},
    {include-group = "ci"},
    {include-group = "doc"},
    "diff-cover",
    "edx-i18n-tools",
]

[tool.semantic_release]
# version is dynamic via setuptools-scm; no version_toml needed
build_command = "python -m pip install --upgrade build && SETUPTOOLS_SCM_PRETEND_VERSION=$NEW_VERSION python -m build"

[tool.edx_lint]
uv_constraints = []

# NOTE: [tool.uv].constraint-dependencies is machine-managed.
# Run: uv run --with edx-lint edx_lint write_uv_constraints pyproject.toml
[tool.uv]
package = true
conflicts = [
    [
        {group = "test"},
        {group = "django42"},
    ],
]
constraint-dependencies = []
